<script>
(()=>{
const createClient=window.supabase?.createClient;
const app=document.getElementById('app'),overlay=document.getElementById('overlay');
const cleanDefaultInvite=()=>{const form=app.querySelector('#auth-form');if(form&&!app.querySelector('.invite-verified')){const note=document.createElement('div');note.className='notice invite-verified';note.textContent='Your invitation was verified from this link. You do not need to enter a separate token.';form.after(note)}};
new MutationObserver(cleanDefaultInvite).observe(app,{childList:true,subtree:true});
document.addEventListener('click',event=>{const button=event.target.closest('[data-action="facebook"]');if(button&&appState.authMode==='signup'){event.preventDefault();event.stopImmediatePropagation();showToast('Create new accounts with email and password so the private invitation can be verified.')}},true);

function esc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(value=''){return String(value).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'ZT'}
function money(value){return new Intl.NumberFormat('en-ZM',{style:'currency',currency:'ZMW',maximumFractionDigits:2}).format(Number(value||0))}
function dateTime(value){return new Intl.DateTimeFormat('en-ZM',{hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
function showToast(message){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),3600)}

function authView(){return `${topbar()}<main class="auth-wrap"><section class="auth-art"><div><div class="eyebrow" style="color:#7de3d2">Zambia's community marketplace</div><h1>Shop local.<br><em>Grow together.</em></h1><p>Discover trusted neighbourhood shops, find what you need and make every connection count.</p></div><div class="art-foot">Built for Zambia · Prices in ZMW · People first</div><div class="art-orb"></div></section><section class="panel auth-card"><h2>${appState.authMode==='login'?'Welcome back':'Join the community'}</h2><p>${appState.authMode==='login'?'Sign in to your Zed Trade Hub account.':'Create your account to start your verified seller profile.'}</p><div class="auth-switch"><button data-action="auth-mode" data-value="login" class="${appState.authMode==='login'?'active':''}">Log in</button><button data-action="auth-mode" data-value="signup" class="${appState.authMode==='signup'?'active':''}">Create account</button></div><form id="auth-form">${appState.authMode==='signup'?'<div class="field"><label>FULL NAME</label><input name="full_name" autocomplete="name" placeholder="Your full name" required></div>':''}<div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label>PASSWORD</label><input name="password" type="password" autocomplete="${appState.authMode==='login'?'current-password':'new-password'}" minlength="8" placeholder="At least 8 characters" required></div><button class="btn" style="width:100%" type="submit">${appState.authMode==='login'?'Log in securely':'Create my account'}</button></form><div class="divider">OR CONTINUE WITH</div><button class="btn dark" style="width:100%" data-action="facebook">Continue with Facebook</button><div id="auth-error" style="margin-top:12px"></div><p class="route-notice">By continuing, you agree to trade respectfully and follow local laws. Access is limited to invited members.</p></section></main>`}

function productCard(p,withSeller=true){const seller=appState.directory.find(s=>s.id===p.user_id);const own=p.user_id===appState.session?.user.id;const deliveries=Array.isArray(p.delivery_meta)?p.delivery_meta:[];return `<article class="product-card">${p.image_url?`<img class="product-photo" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="product-no-photo">Zed Trade Hub</div>`}<div class="product-info"><h3 class="product-name">${esc(p.name)}</h3><div class="price-row"><span class="price">${money(p.retail_price)} <small>retail</small></span><span class="stock">${Number(p.stock)} in stock</span></div>${Number(p.wholesale_price)>0?`<div class="delivery-list">Wholesale ${money(p.wholesale_price)}</div>`:''}<div class="delivery-list">${deliveries.map(esc).join(' · ')||'Ask seller about delivery'}</div>${withSeller?`<div class="seller-line">${seller?.avatar_url?`<img src="${esc(seller.avatar_url)}" alt="">`:`<span class="seller-avatar">${initials(seller?.full_name)}</span>`}<span>${esc(seller?.full_name||'Local seller')}</span></div>`:''}${own?`<div class="callout-row" style="margin-top:12px"><button class="btn ghost small" data-action="edit-product" data-id="${p.id}">Edit listing</button><button class="btn danger small" data-action="pause-product" data-id="${p.id}">Pause</button></div>`:`<button class="btn small" style="width:100%;margin-top:12px" data-action="order-item" data-id="${p.id}">Request this item</button>`}</div></article>`}

function youTab(){const p=appState.profile;const own=appState.products.filter(x=>x.user_id===p.id);return `<div class="profile-layout"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Your profile</h2><p class="panel-sub">This information helps your community recognise you.</p></div><span class="badge ${p.status==='approved'?'':'pending'}">${esc((p.status||'pending').replace('_',' '))}</span></div><div class="profile-layout" style="padding-top:0"><div class="profile-summary">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="Profile photo">`:`<div class="avatar-large">${initials(p.full_name)}</div>`}<div><h3>${esc(p.full_name||'Your name')}</h3><p>${esc([p.city,p.province].filter(Boolean).join(', ')||'Location not added')}<br>${esc(p.email||appState.session.user.email||'')}</p></div></div><form class="form-box" id="profile-form"><h3>Personal details</h3><div class="field-grid"><div class="field"><label>FULL NAME</label><input name="full_name" required value="${esc(p.full_name||'')}"></div><div class="field"><label>PHONE NUMBER</label><input name="phone" type="tel" required placeholder="+260 97 000 0000" value="${esc(p.phone||'')}"></div><div class="field"><label>PROVINCE</label><select name="province" required><option value="">Select province</option>${provinces.map(v=>`<option ${p.province===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>CITY / TOWN</label><select name="city" required><option value="">Select city</option>${cities.map(v=>`<option ${p.city===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div><div class="field"><label>PHYSICAL ADDRESS</label><input name="address" required placeholder="Area, street or landmark" value="${esc(p.address||'')}"></div><label class="upload-drop">${p.avatar_url?'Change profile photo':'Upload profile photo'}<input name="avatar" type="file" accept="image/*"></label><button class="btn" style="margin-top:12px">Save profile</button></form></div><div class="panel-head"><div><h2 class="panel-title">Your inventory</h2><p class="panel-sub">${own.length} active ${own.length===1?'listing':'listings'} · Retail and wholesale pricing</p></div><button class="btn small" data-action="add-product">${svg.plus} Add listing</button></div>${own.length?`<div class="card-grid">${own.map(p=>productCard(p,false)).join('')}</div>`:empty('bag','Open your Status Shop','List a product or service and let nearby buyers discover it.','<button class="btn" data-action="add-product">Add your first listing</button>')}</section><aside class="panel"><div class="panel-head"><div><h2 class="panel-title">Account & privacy</h2><p class="panel-sub">Your trust, safety and preferences.</p></div></div><div style="padding:0 18px 18px"><div class="notice">${svg.shield} <strong>${esc(p.role||'user').toUpperCase()}</strong> account · ${esc((p.status||'pending').replace('_',' '))} review status</div><div class="secure-note">${svg.lock} End-to-end encryption enabled for chats</div><p class="panel-sub" style="line-height:1.7">Private key material is encrypted with your account password. Messages can only be read by chat participants whose devices hold the matching keys.</p><button class="btn ghost small" data-action="share-invite">Copy invite link</button><button class="btn danger small" style="margin-left:5px" data-action="sign-out">Log out</button></div></aside></div>`}
function adminTab(){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Approval queue</h2><p class="panel-sub">Approve access, request changes or decline applications.</p></div><span class="badge pending">${appState.pending.length} pending</span></div><div style="padding:0 22px 20px">${appState.pending.length?appState.pending.map(p=>`<div class="admin-row"><div class="person"><strong>${esc(p.full_name||'New member')}</strong><small>${esc(p.phone||'Phone not provided')} · ${esc([p.city,p.province].filter(Boolean).join(', ')||'Location not provided')}<br>${esc(p.email||'')}</small></div><div class="admin-actions"><button class="btn small" data-action="moderate" data-id="${p.id}" data-value="approve">Approve</button><button class="btn ghost small" data-action="moderate" data-id="${p.id}" data-value="ask_updates">Ask updates</button><button class="btn danger small" data-action="moderate" data-id="${p.id}" data-value="decline">Decline</button></div></div>`).join(''):empty('check','Queue is clear','New member profiles awaiting review will be listed here.')}</div></section>${appState.profile.role==='manager'?`<section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2 class="panel-title">Member roles</h2><p class="panel-sub">Manager-only controls for appointed moderators.</p></div><span class="badge">${appState.adminUsers.length} members</span></div><div style="padding:0 22px 20px">${appState.adminUsers.length?appState.adminUsers.map(p=>`<div class="admin-row"><div class="person"><strong>${esc(p.full_name||'Member')}</strong><small>${esc(p.email||'')} · ${esc(p.status)}</small></div><span class="badge">${esc(p.role)}</span>${p.role!=='manager'?`<button class="btn ${p.role==='moderator'?'danger':'dark'} small" data-action="role-toggle" data-id="${p.id}" data-value="${p.role==='moderator'?'user':'moderator'}">${p.role==='moderator'?'Revoke moderator':'Make moderator'}</button>`:''}</div>`).join(''):'<div class="panel-sub">No other members yet.</div>'}</div></section>`:''}`}
function renderTab(){if(appState.tab==='shops')return shopTab();if(appState.tab==='chats')return chatTab();if(appState.tab==='orders')return ordersTab();if(appState.tab==='admin')return adminTab();return youTab()}
function showModal(title,body){overlay.innerHTML=`<div class="modal-back" data-action="dismiss-modal"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2>${title}</h2><button class="close" data-action="close-modal" aria-label="Close">×</button></header><div class="modal-body">${body}</div></section></div>`}
function renderMessages(){const me=appState.session.user.id;const entries=[...appState.messages.map(m=>({...m,kind:'message'})),...(appState.chatKind==='group'?appState.groupActivity.map(x=>({...x,kind:'system'})):[])].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));return entries.map(m=>{const when=new Date(m.timestamp).toLocaleDateString('en-ZM');if(m.kind==='system')return `<div class="bubble-day">${esc(when)} · ${esc(m.text)}</div>`;const text=m.decrypted??(appState.privateKey?'This message could not be decrypted on this device.':'Unlock your encryption key to read messages.');return `<div class="bubble ${m.sender_id===me?'mine':''}">${esc(text)}<div class="time">${dateTime(m.timestamp)}</div></div>`}).join('')||`<div class="bubble-day">Today</div><div class="bubble" style="margin:auto">Messages are end-to-end encrypted. Start the conversation.</div>`}
const provinces=['Central','Copperbelt','Eastern','Luapula','Lusaka','Muchinga','Northern','North-Western','Southern','Western'];
const cities=['Chililabombwe','Chingola','Chipata','Choma','Isoka','Kabwe','Kalulushi','Kasama','Kitwe','Livingstone','Luanshya','Lusaka','Mansa','Mazabuka','Mongu','Mpika','Mufulira','Ndola','Solwezi'];
async function refreshData(){if(!appState.session)return;const db=appState.client,me=appState.session.user.id;const [dir,prod,orders,members,ownMembers]=await Promise.all([db.from('seller_directory').select('id,full_name,city,province,avatar_url,shop_cover_url,encryption_public_key').order('full_name'),db.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false}),db.from('orders').select('*,product:products(name)').order('created_at',{ascending:false}),db.from('group_members').select('group_id,user_id,created_at,group:marketplace_groups(name)').eq('user_id',me),db.from('group_members').select('group_id,user_id,created_at').order('created_at')]);for(const r of [dir,prod,orders,members,ownMembers])if(r.error)throw r.error;appState.directory=dir.data||[];appState.products=prod.data||[];appState.orders=orders.data||[];appState.members=members.data||[];appState.groupActivity=(ownMembers.data||[]).filter(m=>appState.members.some(my=>my.group_id===m.group_id)).map(m=>({timestamp:m.created_at,text:`${appState.directory.find(p=>p.id===m.user_id)?.full_name||'A member'} joined the community`}));const {data:ms,error:meErr}=await db.from('messages').select('sender_id,receiver_id,group_id').or(`sender_id.eq.${me},receiver_id.eq.${me}`);if(meErr)throw meErr;const ids=[...new Set((ms||[]).flatMap(x=>[x.sender_id,x.receiver_id]).filter(x=>x&&x!==me))];appState.contacts=appState.directory.filter(p=>ids.includes(p.id));if(['manager','moderator'].includes(appState.profile.role)){const {data,error}=await db.from('profiles').select('*').in('status',['pending','needs_updates']).order('created_at',{ascending:true});if(error)throw error;appState.pending=data||[]}render()}
function subscribeRealtime(){if(appState.channel)appState.client.removeChannel(appState.channel);appState.channel=appState.client.channel(`zed-${appState.session.user.id}`).on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>refreshData().catch(()=>{})).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>refreshData().catch(()=>{})).on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{if(appState.chatId)loadMessages().catch(()=>{});refreshData().catch(()=>{})}).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>{if(['manager','moderator'].includes(appState.profile.role))refreshData().catch(()=>{})}).subscribe()}
async function loadMessages(){const me=appState.session.user.id;let q=appState.client.from('messages').select('*').order('timestamp',{ascending:true});if(appState.chatKind==='group')q=q.eq('group_id',appState.chatId);else q=q.or(`and(sender_id.eq.${me},receiver_id.eq.${appState.chatId}),and(sender_id.eq.${appState.chatId},receiver_id.eq.${me})`);const {data,error}=await q;if(error)throw error;appState.messages=await Promise.all((data||[]).map(decryptMessage));const area=document.getElementById('message-area');if(area){area.innerHTML=renderMessages();area.scrollTop=area.scrollHeight}}
async function chooseGroup(id){if(!id){showToast('Your community group is not configured yet.');return}appState.chatKind='group';appState.chatId=id;appState.threadTitle='Zed Trade Community';render();try{await loadMessages()}catch(e){showToast(e.message)}}
async function chooseChat(id){const peer=appState.directory.find(p=>p.id===id);appState.chatKind='direct';appState.chatId=id;appState.threadTitle=peer?.full_name||'Private chat';render();try{await loadMessages()}catch(e){showToast(e.message)}}
async function sendMessage(text){const body=text.trim();if(!body||!appState.chatId)return;let ids;if(appState.chatKind==='group'){const {data,error}=await appState.client.from('group_members').select('user_id').eq('group_id',appState.chatId);if(error)throw error;ids=[...new Set([appState.session.user.id,...data.map(x=>x.user_id)])]}else ids=[appState.session.user.id,appState.chatId];const envelope=await encryptFor(ids,body,appState.chatKind==='group');const row={sender_id:appState.session.user.id,receiver_id:appState.chatKind==='direct'?appState.chatId:null,group_id:appState.chatKind==='group'?appState.chatId:null,encrypted_text:envelope};const {error}=await appState.client.from('messages').insert(row);if(error)throw error;await loadMessages()}
function productForm(product){const p=product||{};return `<form id="product-form" data-id="${p.id||''}"><div class="field"><label>PRODUCT OR SERVICE NAME</label><input name="name" required maxlength="100" value="${esc(p.name||'')}" placeholder="e.g. Fresh garden tomatoes"></div><div class="field-grid"><div class="field"><label>CATEGORY</label><select name="category" required>${['Produce','Food & groceries','Fashion','Home & living','Electronics','Beauty & wellness','Services','Other'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>CURRENT STOCK COUNT</label><input name="stock" type="number" min="0" step="1" value="${Number(p.stock)||0}" required></div><div class="field"><label>RETAIL PRICE (ZMW)</label><input name="retail_price" type="number" min="0.01" step="0.01" value="${p.retail_price||''}" required></div><div class="field"><label>WHOLESALE PRICE (ZMW)</label><input name="wholesale_price" type="number" min="0" step="0.01" value="${p.wholesale_price||0}" required></div></div><div class="field"><label>DELIVERY OPTIONS</label><div class="callout-row">${['In-Store Pickup','Local Courier Delivery'].map(x=>`<label style="font-size:11px"><input type="checkbox" name="delivery_meta" value="${x}" ${(p.delivery_meta||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><label class="upload-drop">${p.image_url?'Replace listing photo':'Add a product photo'}<input name="image" type="file" accept="image/*"></label><div id="product-error"></div><button class="btn" style="width:100%;margin-top:14px">${p.id?'Save listing':'Publish to my Status Shop'}</button></form>`}
function orderForm(product){const seller=appState.directory.find(x=>x.id===product.user_id);return `<div class="profile-summary" style="margin-bottom:14px">${product.image_url?`<img src="${esc(product.image_url)}" alt="">`:`<div class="avatar-large">${initials(product.name)}</div>`}<div><h3>${esc(product.name)}</h3><p>Sold by ${esc(seller?.full_name||'local seller')} · ${Number(product.stock)} available</p></div></div><form id="order-form" data-id="${product.id}"><div class="field-grid"><div class="field"><label>QUANTITY</label><input name="quantity" type="number" min="1" max="${Number(product.stock)}" value="1" required></div><div class="field"><label>PRICE TYPE</label><select name="unit_type"><option value="retail">Retail · ${money(product.retail_price)}</option>${Number(product.wholesale_price)>0?`<option value="wholesale">Wholesale · ${money(product.wholesale_price)}</option>`:''}</select></div></div><div class="field"><label>DELIVERY</label><select name="delivery_option" required>${(product.delivery_meta||[]).map(x=>`<option>${esc(x)}</option>`).join('')||'<option>Arrange with seller</option>'}</select></div><div class="notice">This sends a request to the seller and opens a private encrypted chat. No payment is taken here.</div><div id="order-error"></div><button class="btn" style="width:100%;margin-top:14px">Send order request</button></form>`}
async function saveOnboarding(form){const fd=new FormData(form),avatar=fd.get('avatar');let url=appState.profile.avatar_url||null;if(avatar?.size)url=await uploadAsset(avatar,'avatar');if(!url)throw new Error('Upload a profile photo before submitting your profile.');const update={full_name:String(fd.get('full_name')).trim(),phone:String(fd.get('phone')).trim(),province:String(fd.get('province')),city:String(fd.get('city')),address:String(fd.get('address')).trim(),avatar_url:url};const {error}=await appState.client.from('profiles').update(update).eq('id',appState.session.user.id);if(error)throw error;if(appState.profile.status==='needs_updates'){const {error:e}=await appState.client.rpc('submit_profile_for_review');if(e)throw e}appState.profile={...appState.profile,...update,status:appState.profile.status==='needs_updates'?'pending':appState.profile.status};render();showToast('Profile submitted for community review.')}
async function saveProfile(form){const fd=new FormData(form),avatar=fd.get('avatar');let url=appState.profile.avatar_url||null;if(avatar?.size)url=await uploadAsset(avatar,'avatar');const values={full_name:String(fd.get('full_name')).trim(),phone:String(fd.get('phone')).trim(),province:String(fd.get('province')),city:String(fd.get('city')),address:String(fd.get('address')).trim(),avatar_url:url};const {error}=await appState.client.from('profiles').update(values).eq('id',appState.session.user.id);if(error)throw error;appState.profile={...appState.profile,...values};await refreshData();showToast('Profile saved.')}
async function saveProduct(form){const fd=new FormData(form),id=form.dataset.id;const current=id?appState.products.find(p=>p.id===id):null;let image=current?.image_url||null;if(fd.get('image')?.size)image=await uploadAsset(fd.get('image'),'product');const delivery=fd.getAll('delivery_meta');if(!delivery.length)throw new Error('Choose at least one delivery option.');const row={user_id:appState.session.user.id,name:String(fd.get('name')).trim(),category:String(fd.get('category')),retail_price:Number(fd.get('retail_price')),wholesale_price:Number(fd.get('wholesale_price')),stock:Number(fd.get('stock')),delivery_meta:delivery,image_url:image,is_active:true};const result=id?await appState.client.from('products').update(row).eq('id',id):await appState.client.from('products').insert(row);if(result.error)throw result.error;overlay.innerHTML='';await refreshData();appState.tab='you';render();showToast(id?'Listing updated.':'Your listing is live in Status Shops.')}
async function requestOrder(form){const product=appState.products.find(p=>p.id===form.dataset.id);if(!product)throw new Error('This listing is no longer available.');const fd=new FormData(form),quantity=Number(fd.get('quantity')),unit=String(fd.get('unit_type')),delivery=String(fd.get('delivery_option'));if(quantity<1||quantity>product.stock)throw new Error('Enter a quantity within the available stock.');const price=unit==='wholesale'?Number(product.wholesale_price):Number(product.retail_price);if(unit==='wholesale'&&price<=0)throw new Error('Wholesale pricing is not available.');const vendor=appState.directory.find(p=>p.id===product.user_id);if(!vendor?.encryption_public_key)throw new Error('This seller has not set up secure messaging yet.');const body=`Order request: ${quantity} × ${product.name} (${unit}) at ${money(price)} each. Delivery: ${delivery}. Total: ${money(price*quantity)}.`;const encrypted=await encryptFor([appState.session.user.id,product.user_id],body);const {error}=await appState.client.rpc('create_order_request',{p_product_id:product.id,p_quantity:quantity,p_unit_type:unit,p_delivery_option:delivery,p_encrypted_text:encrypted});if(error)throw error;overlay.innerHTML='';appState.tab='orders';await refreshData();showToast('Order request sent in an encrypted private chat.')}
async function moderate(id,action){let note=null;if(action==='ask_updates'){note=prompt('What should the applicant update?','Please complete or clarify your profile details.');if(note===null)return}const {error}=await appState.client.rpc('moderate_profile',{p_user_id:id,p_action:action,p_note:note});if(error)throw error;await refreshData();showToast(action==='approve'?'Member approved.':action==='decline'?'Application declined.':'Update request saved.')}
async function openEvent(action,el,ev){const id=el.dataset.id,value=el.dataset.value;switch(action){case'connect':await connect(document.getElementById('project-url')?.value||'',document.getElementById('anon-key')?.value||'',document.getElementById('invite-token')?.value||'');break;case'auth-mode':appState.authMode=value;render();break;case'facebook':{const {error}=await appState.client.auth.signInWithOAuth({provider:'facebook',options:{redirectTo:location.href}});if(error)throw error;break}case'tab':appState.tab=value;appState.chatId=null;render();break;case'filter':appState.filters=value;render();break;case'open-shop':shopDetail(id);break;case'order-item':{const p=appState.products.find(x=>x.id===id);if(p)showModal('Request an order',orderForm(p));break}case'add-product':showModal('Add to your Status Shop',productForm());break;case'edit-product':{const p=appState.products.find(x=>x.id===id);if(p)showModal('Edit listing',productForm(p));break}case'pause-product':if(confirm('Pause this listing? It will no longer appear in the marketplace.')){const {error}=await appState.client.from('products').update({is_active:false}).eq('id',id);if(error)throw error;await refreshData();showToast('Listing paused.')}break;case'open-chat':await chooseChat(id);break;case'open-group':await chooseGroup(id);break;case'back-chats':appState.chatId=null;render();break;case'start-chat':overlay.innerHTML='';appState.tab='chats';await chooseChat(id);break;case'moderate':await moderate(id,value);break;case'role-toggle':{const {error}=await appState.client.rpc('set_moderator_role',{p_user_id:id,p_make_moderator:value==='moderator'});if(error)throw error;await refreshData();showToast('Member role updated.');break}case'order-status':{const {error}=await appState.client.rpc('update_order_status',{p_order_id:id,p_status:value});if(error)throw error;await refreshData();showToast(`Order ${value}.`);break}case'edit-profile':appState.profile.status=appState.profile.status==='needs_updates'?'needs_updates':'pending';app.innerHTML=renderOnboarding();break;case'sign-out':await appState.client.auth.signOut();appState.session=null;appState.profile=null;appState.privateKey=null;render();break;case'close-modal':overlay.innerHTML='';break;case'dismiss-modal':if(el===ev.target)overlay.innerHTML='';break;case'share-invite':{const url=`${location.origin}/join/ZEDJOIN2026`;try{await navigator.clipboard.writeText(url);showToast('Invite link copied.')}catch{prompt('Copy this invite link',url)}break}}}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;event.preventDefault();try{await openEvent(el.dataset.action,el,event)}catch(error){const target=document.querySelector('#product-error,#order-error,#crypto-error,#setup-error,#auth-error')||document.querySelector('#view');if(target)target.insertAdjacentHTML('beforeend',`<div class="notice error" style="margin-top:10px">${esc(error.message||'Something went wrong. Please try again.')}</div>`);else showToast(error.message||'Something went wrong.')}});
document.addEventListener('submit',async event=>{const form=event.target;event.preventDefault();try{if(form.id==='invite-form'){const token=document.getElementById('invite-entry').value.trim();if(!token)return;appState.invite=token;history.replaceState({},'',`?invite=${encodeURIComponent(token)}`);const cfg=getCfg();if(cfg)await connect(cfg.url,cfg.key,token);else render();return}if(form.id==='auth-form'){await doAuth(form);return}if(form.id==='onboarding-form'){await saveOnboarding(form);return}if(form.id==='profile-form'){await saveProfile(form);return}if(form.id==='product-form'){await saveProduct(form);return}if(form.id==='order-form'){await requestOrder(form);return}if(form.id==='message-form'){const input=form.elements.message;const text=input.value;input.value='';await sendMessage(text);return}if(form.id==='crypto-form'){const password=String(new FormData(form).get('password'));if(appState.profile.encryption_private_key)await unlockPrivateKey(password);else await createPrivateKey(password);await refreshData();subscribeRealtime();showToast('Secure messaging is ready on this device.');return}}catch(error){const target=form.id==='crypto-form'?document.getElementById('crypto-error'):form.id==='auth-form'?document.getElementById('auth-error'):form.id==='onboarding-form'?document.getElementById('onboarding-error'):form.id==='product-form'?document.getElementById('product-error'):form.id==='order-form'?document.getElementById('order-error'):document.getElementById('view');target?.insertAdjacentHTML('beforeend',`<div class="notice error" style="margin-top:10px">${esc(error.message||'Something went wrong. Please try again.')}</div>`)}});
document.addEventListener('input',event=>{if(!event.target.matches('[data-search]'))return;const value=event.target.value,position=event.target.selectionStart;appState.search=value;const view=document.getElementById('view');view.innerHTML=shopView();const input=view.querySelector('[data-search]');input.focus();input.setSelectionRange(position,position)});
document.addEventListener('change',event=>{if(event.target.name==='province'){const city=document.querySelector('[name="city"]');if(city)city.value=''}});
window.addEventListener('popstate',()=>{const token=new URLSearchParams(location.search).get('invite')||location.pathname.match(/^\/join\/([^/]+)/)?.[1]||'';appState.invite=token;appState.inviteValid=false;if(appState.client&&token)appState.client.rpc('validate_invite',{p_token:token}).then(({data,error})=>{appState.inviteValid=!error&&!!data;render()});else render()});
function renderOnboarding(error=''){const p=appState.profile||{};return `${topbar(true)}<main class="auth-wrap" style="max-width:920px"><section class="auth-art"><div><div class="eyebrow" style="color:#8de8d9">One more step</div><h1>Set up your<br><em>community profile.</em></h1><p>Complete these details to enter the approval queue. A manager or moderator will review your membership.</p></div><div class="art-foot">Profile review keeps the community trusted</div><div class="art-orb"></div></section><section class="panel auth-card"><h2>Your profile</h2><p>All fields are required for account review. Your address and phone number are only visible to you and authorised moderators.</p><form id="onboarding-form"><div class="field"><label>FULL NAME</label><input name="full_name" required value="${esc(p.full_name||'')}" autocomplete="name"></div><div class="field"><label>PHONE NUMBER</label><input name="phone" type="tel" required placeholder="+260 97 000 0000" value="${esc(p.phone||'')}" autocomplete="tel"></div><div class="field-grid"><div class="field"><label>PROVINCE</label><select name="province" required><option value="">Select province</option>${provinces.map(v=>`<option ${p.province===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>CITY / TOWN</label><select name="city" required><option value="">Select city</option>${cities.map(v=>`<option ${p.city===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>PHYSICAL ADDRESS</label><input name="address" required placeholder="Area, street or landmark" value="${esc(p.address||'')}"></div><label class="upload-drop">Choose a profile photo<input name="avatar" type="file" accept="image/*"></label><button class="btn" style="width:100%;margin-top:14px">Submit for approval</button></form><div id="onboarding-error">${error?`<div class="notice error" style="margin-top:12px">${esc(error)}</div>`:''}</div><p class="route-notice">You will be able to browse and message once your profile is approved.</p></section></main>`}
function pendingView(){const p=appState.profile||{},firstManager=p.role==='manager';return `${topbar(true)}<main class="setup-wrap"><section class="setup-card"><div class="setup-intro"><div class="eyebrow" style="color:#8de8d9">${firstManager?'Initial owner setup':'Your profile is in review'}</div><h1>${firstManager?'Take the':'Nearly'}<br><span style="color:#6ee5d2">${firstManager?'owner seat.':'there.'}</span></h1><p>${firstManager?'You are the first account. After completing your profile, approve your owner account to open the marketplace.':'We have received your application. A community manager or moderator will review it shortly.'}</p><div class="secure-note" style="color:#a5dfd5">${svg.shield} ${esc((p.status||'pending').replace('_',' '))}</div></div><div class="setup-content"><h2>Thanks, ${esc(p.full_name||'neighbour')}</h2><p>${firstManager?'Your manager account is pending until you confirm it.':"For everyone's safety, marketplace access opens after profile approval. "+(p.status==='needs_updates'?'Please update the requested details and resubmit.':'You can return here anytime to check your application.')}</p>${p.review_note?`<div class="notice warn" style="margin:12px 0">${esc(p.review_note)}</div>`:''}<div class="profile-summary" style="margin:16px 0">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar-large">${initials(p.full_name)}</div>`}<div><h3>${esc(p.full_name||'')}</h3><p>${esc([p.city,p.province].filter(Boolean).join(', '))}<br>${esc(p.phone||'')}</p></div></div><div class="callout-row">${firstManager?`<button class="btn" data-action="bootstrap-approve">Approve my owner account</button>`:''}<button class="btn ghost" data-action="edit-profile">Update profile</button><button class="btn danger" data-action="sign-out">Log out</button></div></div></section></main>`}
function encryptionGate(){const hasKey=!!appState.profile?.encryption_private_key,emailLogin=appState.session?.user?.app_metadata?.provider==='email';return `${topbar(true)}<main class="setup-wrap"><section class="setup-card"><div class="setup-intro"><div class="eyebrow" style="color:#8de8d9">Private by design</div><h1>Your messages<br>belong to <span style="color:#6ee5d2">you.</span></h1><p>Your private-message key is stored in an encrypted backup. Use the password below to create or unlock it on this device.</p></div><div class="setup-content"><h2>${hasKey?'Unlock secure messaging':'Set up secure messaging'}</h2><p>${hasKey?(emailLogin?'Enter the same password you use to sign in to Zed Trade Hub.':'Enter the private-message password you chose when setting this up.'):(emailLogin?'Use the same password you use to sign in to Zed Trade Hub. This is not a second password.':'Choose a password for your private messages. It can be different from your Facebook password.')}</p><form id="crypto-form"><div class="field"><label>${emailLogin?'ZED TRADE HUB ACCOUNT PASSWORD':'PRIVATE-MESSAGE PASSWORD'}</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%">${hasKey?'Unlock my messages':'Create private-message key'}</button></form><div id="crypto-error"></div><p class="route-notice">For email accounts, this is your normal sign-in password. If you forget or reset it, old encrypted messages cannot be recovered. The app stores only an encrypted copy of your messaging key.</p><button class="btn link small" data-action="sign-out">Log out</button></div></section></main>`}
function render(){if(!appState.client){app.innerHTML=setupView();return}if(!appState.invite){app.innerHTML=inviteView();return}if(!appState.inviteValid){app.innerHTML=inviteView('Invite not yet verified. Connect your Supabase project to validate this token.');return}if(!appState.session){app.innerHTML=authView();return}if(!appState.profile){app.innerHTML=renderOnboarding();return}const p=appState.profile;if(p.status!=='approved'){app.innerHTML=p.status==='pending'||p.status==='needs_updates'?pendingView():renderOnboarding('Your application was declined. You may update your information and contact a moderator.');return}if(!appState.privateKey){app.innerHTML=encryptionGate();return}app.innerHTML=shell()}
function getCfg(){return linkedSupabase}
function normalizeProjectUrl(value){let parsed;try{parsed=new URL(value.trim())}catch{throw new Error('Enter the Supabase Project URL, such as https://your-project.supabase.co.')}if(parsed.protocol!=='https:'||!/^([a-z0-9-]+\.)?supabase\.co$/i.test(parsed.hostname))throw new Error('Use the HTTPS Supabase Project URL, not the dashboard URL.');const path=parsed.pathname.replace(/\/+$/,'');if(path&&path!=='/rest/v1')throw new Error('Remove the extra path after .supabase.co. A /rest/v1 suffix is okay.');return parsed.origin}
async function connect(url,key,token){const problem=document.getElementById('setup-error');let projectUrl;try{projectUrl=normalizeProjectUrl(url)}catch(error){if(problem)problem.innerHTML=`<div class="notice error" style="margin-top:12px">${esc(error.message)}</div>`;return}if(!key.trim()){if(problem)problem.innerHTML='<div class="notice error" style="margin-top:12px">Enter your public anon or publishable key.</div>';return}try{const client=makeClient(projectUrl,key.trim());const {data,error}=await client.rpc('validate_invite',{p_token:token.trim()});if(error)throw error;if(!data)throw new Error('This invite token is not active. Check the link or ask the group manager.');try{localStorage.setItem('zedTradeSupabaseConfig',JSON.stringify({url:projectUrl,key:key.trim()}))}catch{}appState.client=client;appState.invite=token.trim();appState.inviteValid=true;history.replaceState({},'',`?invite=${encodeURIComponent(token.trim())}`);client.auth.onAuthStateChange((_event,session)=>setTimeout(()=>handleSession(session),0));const {data:auth}=await client.auth.getSession();await handleSession(auth.session);render()}catch(err){if(problem)problem.innerHTML=`<div class="notice error" style="margin-top:12px">${esc(err.message||'Could not connect. Check your project and migration.')}</div>`;else{appState.inviteValid=false;render();document.querySelector('.setup-content')?.insertAdjacentHTML('beforeend',`<div class="notice error">${esc(err.message||'Could not validate this invitation.')}</div>`)}}}
async function boot(){const token=new URLSearchParams(location.search).get('invite')||location.pathname.match(/^\/join\/([^/]+)/)?.[1]||'';appState.invite=token;const cfg=getCfg();if(!cfg){render();return}try{appState.client=makeClient(cfg.url,cfg.key);appState.client.auth.onAuthStateChange((_event,session)=>setTimeout(()=>handleSession(session),0));if(token){const {data,error}=await appState.client.rpc('validate_invite',{p_token:token});appState.inviteValid=!error&&!!data}render();const {data}=await appState.client.auth.getSession();await handleSession(data.session)}catch{appState.client=null;render()}}
async function handleSession(session){appState.session=session;appState.profile=null;appState.privateKey=null;if(!session){passwordInMemory='';render();return}const {data,error}=await appState.client.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error){showToast(error.message);render();return}if(!data){appState.profile={id:session.user.id,full_name:session.user.user_metadata?.full_name||'',status:'pending',role:'user'};renderOnboardMissing();return}appState.profile={...data,email:session.user.email};if(appState.profile.status==='approved'){if(passwordInMemory){try{await unlockPrivateKey(passwordInMemory)}catch{passwordInMemory=''}}if(appState.privateKey){await refreshData();subscribeRealtime()}}render()}
function renderOnboardMissing(){appState.profile={...appState.profile,status:'pending'};app.innerHTML=renderOnboarding()}
async function doAuth(form){const f=new FormData(form),email=String(f.get('email')).trim(),password=String(f.get('password'));passwordInMemory=password;let result;if(appState.authMode==='signup')result=await appState.client.auth.signUp({email,password,options:{data:{full_name:String(f.get('full_name')).trim(),invite_token:appState.invite||''}}});else result=await appState.client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(appState.authMode==='signup'&&!result.data.session){appState.authMode='login';render();document.querySelector('#auth-error').innerHTML='<div class="notice">Check your email to confirm your account, then log in to complete your profile.</div>';return}await handleSession(result.data.session)}
async function uploadAsset(file,kind){if(!file)return null;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>8*1024*1024)throw new Error('Choose a JPG, PNG, WebP or GIF image under 8 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${appState.session.user.id}/${kind}-${crypto.randomUUID()}.${ext}`,bucket=kind==='avatar'?'profile-avatars':'marketplace-media';const {error}=await appState.client.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type,cacheControl:'3600'});if(error)throw error;return appState.client.storage.from(bucket).getPublicUrl(path).data.publicUrl}
function b64(bytes){let s='';for(const x of new Uint8Array(bytes))s+=String.fromCharCode(x);return btoa(s)}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derivePassKey(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function createPrivateKey(password){if(!crypto.subtle)throw new Error('Secure messaging requires a modern browser on a secure connection.');const pair=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:3072,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);const pub=await crypto.subtle.exportKey('jwk',pair.publicKey),priv=await crypto.subtle.exportKey('jwk',pair.privateKey),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derivePassKey(password,salt),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(priv)));const backup=JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ciphertext:b64(cipher)});const {error}=await appState.client.from('profiles').update({encryption_public_key:JSON.stringify(pub),encryption_private_key:backup}).eq('id',appState.session.user.id);if(error)throw error;appState.profile.encryption_public_key=JSON.stringify(pub);appState.profile.encryption_private_key=backup;appState.privateKey=pair.privateKey;passwordInMemory=password}
async function unlockPrivateKey(password){const backup=JSON.parse(appState.profile.encryption_private_key||'null');if(!backup)throw new Error('No encrypted private key');const key=await derivePassKey(password,unb64(backup.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(backup.iv)},key,unb64(backup.ciphertext));const jwk=JSON.parse(new TextDecoder().decode(plain));appState.privateKey=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);passwordInMemory=password}
async function encryptFor(ids,text,skipUnkeyed=false){const raw=crypto.getRandomValues(new Uint8Array(32)),aes=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,new TextEncoder().encode(text));const recipients=[...new Set(ids)];const {data,error}=await appState.client.from('seller_directory').select('id,encryption_public_key').in('id',recipients);if(error)throw error;const keys={};for(const row of data||[]){if(!row.encryption_public_key){if(skipUnkeyed)continue;throw new Error('A participant has not activated secure messaging yet.')}const pub=await crypto.subtle.importKey('jwk',JSON.parse(row.encryption_public_key),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);keys[row.id]=b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw))}if(!keys[appState.session.user.id]&&appState.profile.encryption_public_key){const pub=await crypto.subtle.importKey('jwk',JSON.parse(appState.profile.encryption_public_key),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);keys[appState.session.user.id]=b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw))}return JSON.stringify({v:1,iv:b64(iv),ciphertext:b64(cipher),keys})}
async function decryptMessage(row){try{const envelope=JSON.parse(row.encrypted_text);if(!envelope.keys?.[appState.session.user.id])return row;const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},appState.privateKey,unb64(envelope.keys[appState.session.user.id]));const aes=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const text=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(envelope.iv)},aes,unb64(envelope.ciphertext));return {...row,decrypted:new TextDecoder().decode(text)}}catch{return row}}
async function loadAdminUsers(){if(appState.profile?.role!=='manager')return;const {data,error}=await appState.client.from('profiles').select('id,email,full_name,status,role,suspended_at,suspension_note').eq('status','approved').neq('id',appState.session.user.id).order('full_name');if(error)throw error;appState.adminUsers=data||[];if(appState.tab==='admin')render()}
document.addEventListener('click',event=>{if(event.target.closest('[data-action="tab"]')?.dataset.value==='admin'&&appState.profile?.role==='manager')loadAdminUsers().catch(e=>showToast(e.message))});
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action="role-toggle"]');if(!button||appState.profile?.role!=='manager')return;event.preventDefault();event.stopImmediatePropagation();try{const {error}=await appState.client.rpc('set_moderator_role',{p_user_id:button.dataset.id,p_make_moderator:button.dataset.value==='moderator'});if(error)throw error;await loadAdminUsers();showToast('Member role updated.')}catch(error){showToast(error.message||'Could not update member role.')}},true);
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action="share-invite"]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();try{const {data,error}=await appState.client.from('marketplace_settings').select('active_invite_token').eq('id',true).maybeSingle();if(error)throw error;const token=data?.active_invite_token||appState.invite;if(!token)throw new Error('Ask management for the active invite link.');appState.invite=token;appState.inviteValid=true;history.replaceState({},'',`?invite=${encodeURIComponent(token)}`);const url=`${location.origin}/join/${encodeURIComponent(token)}`;if(navigator.share)await navigator.share({title:'Join Zed Trade Hub',text:'Join our invited local marketplace.',url});else{await navigator.clipboard.writeText(url);showToast('Invite link copied.')}}catch(error){if(error.name!=='AbortError')showToast(error.message||'Could not share the invitation.')}},true);
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action="bootstrap-approve"]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();try{const {error}=await appState.client.rpc('approve_initial_manager');if(error)throw error;await handleSession(appState.session);showToast('Initial manager approved. Set up secure messaging to continue.')}catch(error){showToast(error.message||'Could not approve the initial manager.')}},true);
document.addEventListener('submit',async event=>{const form=event.target;if(form.id!=='invite-rotate-form')return;event.preventDefault();event.stopImmediatePropagation();try{if(!appState.invite)throw new Error('Open the active manager invite link before rotating it.');const next=String(new FormData(form).get('token')).trim();const {error}=await appState.client.rpc('rotate_invite_token',{p_current_token:appState.invite,p_new_token:next});if(error)throw error;appState.invite=next;history.replaceState({},'',`?invite=${encodeURIComponent(next)}`);await loadAdminUsers();showToast('Invite rotated. Share the updated join link.')}catch(error){form.insertAdjacentHTML('beforeend',`<div class="notice error" style="margin-top:10px">${esc(error.message||'Could not rotate the invite.')}</div>`) }},true);

const originalRender=render,originalRefreshData=refreshData;
function applyTheme(){document.documentElement.dataset.theme=['teal','berry','ocean'].includes(appState.theme)?appState.theme:'teal'}
function shopStats(id){const rows=appState.reviews.filter(r=>r.seller_id===id);return{count:rows.length,average:rows.length?rows.reduce((n,r)=>n+Number(r.rating),0)/rows.length:0}}
function stars(value){return `<span class="rating" aria-label="${Number(value).toFixed(1)} out of 5">${'★'.repeat(Math.round(value))}${'☆'.repeat(5-Math.round(value))}</span>`}
function productCard(p,withSeller=true){const seller=appState.directory.find(s=>s.id===p.user_id),own=p.user_id===appState.session?.user.id,status=p.listing_status==='sold'||Number(p.stock)<=0?'sold':'available',hidden=!p.is_active,deliveries=Array.isArray(p.delivery_meta)?p.delivery_meta:[];return `<article class="product-card">${p.image_url?`<img class="product-photo" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="product-no-photo">Zed Trade Hub</div>`}<div class="product-info"><span class="status-pill ${hidden?'hidden':status==='sold'?'sold':''}">${hidden?'Pulled down':status==='sold'?'Sold':'Available'}</span><h3 class="product-name">${esc(p.name)}</h3><div class="price-row"><span class="price">${money(p.retail_price)} <small>retail</small></span><span class="stock">${Number(p.stock)} in stock</span></div>${Number(p.wholesale_price)>0?`<div class="delivery-list">Wholesale ${money(p.wholesale_price)}</div>`:''}<div class="delivery-list">${deliveries.map(esc).join(' · ')||'Ask seller about delivery'}</div>${withSeller?`<div class="seller-line">${seller?.avatar_url?`<img src="${esc(seller.avatar_url)}" alt="">`:`<span class="seller-avatar">${initials(seller?.full_name)}</span>`}<span>${esc(seller?.shop_name||seller?.full_name||'Local seller')}</span></div>`:''}${own?`<div class="mobile-feature-actions" style="margin-top:11px"><button class="btn ghost small" data-action="edit-product" data-id="${p.id}">Edit</button><button class="btn ghost small" data-action="listing-status" data-id="${p.id}" data-value="${status==='sold'?'available':'sold'}">${status==='sold'?'Mark available':'Mark sold'}</button><button class="btn danger small" data-action="listing-visibility" data-id="${p.id}" data-value="${hidden?'show':'hide'}">${hidden?'Put back up':'Pull down'}</button></div>`:status==='available'&&!hidden?`<button class="btn small" style="width:100%;margin-top:12px" data-action="order-item" data-id="${p.id}">Request this item</button><button class="btn link small" data-action="report-listing" data-id="${p.id}">Flag listing</button>`:`<div class="notice warn" style="margin-top:10px">${hidden?'This listing is not public.':'This item has been marked sold.'}</div>`}</div></article>`}
function shopView(){const query=appState.search.toLowerCase(),active=appState.products.filter(p=>p.is_active),sellerIds=new Set(active.map(p=>p.user_id));let shops=appState.directory.filter(s=>sellerIds.has(s.id)&&[s.shop_name,s.full_name,s.city,s.province,s.shop_category].some(x=>String(x||'').toLowerCase().includes(query)));if(appState.filters!=='All')shops=shops.filter(s=>active.some(p=>p.user_id===s.id&&p.category===appState.filters));return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Status Shops</h2><p class="panel-sub">${shops.length} trusted local ${shops.length===1?'shop':'shops'} and their catalogues</p></div><div class="searchbox">${svg.search}<input data-search placeholder="Search shops or city" value="${esc(appState.search)}"></div></div><div class="filter-row">${['All',...new Set(active.map(p=>p.category).filter(Boolean))].map(v=>`<button class="filter-chip ${v===appState.filters?'active':''}" data-action="filter" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div>${shops.length?`<div class="shop-list">${shops.map(s=>{const count=active.filter(p=>p.user_id===s.id).length,r=shopStats(s.id);return `<article class="shop-card"><div class="shop-cover">${s.shop_cover_url?`<img src="${esc(s.shop_cover_url)}" alt="">`:`<div class="shop-initial">${initials(s.shop_name||s.full_name)}</div>`}${s.avatar_url?`<img class="shop-avatar" src="${esc(s.avatar_url)}" alt="">`:''}</div><h3>${esc(s.shop_name||s.full_name||'Zed seller')}</h3><div class="shop-meta">${esc([s.city,s.province].filter(Boolean).join(', ')||'Zambia')} · ${count} ${count===1?'listing':'listings'}</div><div class="shop-meta">${stars(r.average)} ${r.count?`${r.average.toFixed(1)} · ${r.count} reviews`:'New shop'} · ${esc(s.shop_category||'Shopping & retail')}</div><button class="btn ghost small" data-action="open-shop" data-id="${s.id}">View shop & catalogue</button></article>`}).join('')}</div>`:empty('shop','No shops to show yet','Verified sellers and their active catalogues will appear here. Check back soon.')}</section>`}
function shopDetail(id){const s=appState.directory.find(x=>x.id===id);if(!s)return;const list=appState.products.filter(p=>p.user_id===id&&p.is_active),r=shopStats(id),mine=appState.reviews.find(x=>x.seller_id===id&&x.reviewer_id===appState.session.user.id),phone=String(s.shop_whatsapp||'').replace(/[^0-9]/g,'');const reviewForm=id===appState.session.user.id?'':`<form id="review-form" data-id="${id}"><h3>${mine?'Update your review':'Leave a shop review'}</h3><div class="field-grid"><div class="field"><label>RATING</label><select name="rating" required>${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(mine?.rating||5)===n?'selected':''}>${n} out of 5</option>`).join('')}</select></div><div class="field"><label>YOUR EXPERIENCE</label><textarea name="body" maxlength="1000" rows="2" placeholder="Share a helpful, respectful note">${esc(mine?.body||'')}</textarea></div></div><button class="btn small">${mine?'Save review':'Post review'}</button></form>`;showModal(`${esc(s.shop_name||s.full_name)}'s shop`,`<section class="business-card"><div class="business-hero">${s.shop_cover_url?`<img src="${esc(s.shop_cover_url)}" alt="Shop cover">`:''}${s.avatar_url?`<img class="shop-avatar" src="${esc(s.avatar_url)}" alt="">`:''}</div><div class="business-details"><h3>${esc(s.shop_name||s.full_name||'Local shop')}</h3><div>${stars(r.average)} ${r.count?`${r.average.toFixed(1)} · ${r.count} reviews`:'New shop'}</div><p>${esc([s.city,s.province].filter(Boolean).join(', ')||'Zambia')} · ${esc(s.shop_category||'Shopping & retail')}</p>${s.shop_description?`<p>${esc(s.shop_description)}</p>`:''}<p>Business hours: ${esc(s.shop_hours||'Contact for hours')}</p><div class="business-actions"><button class="btn ghost small" data-action="start-chat" data-id="${id}">${svg.chat} Message</button>${phone?`<a class="btn ghost small" href="https://wa.me/${phone}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="btn ghost small" data-action="shop-share" data-id="${id}">Share shop</button></div></div></section><section class="panel" style="margin-top:14px"><div class="panel-head"><div><h3 class="panel-title">Catalogue</h3><p class="panel-sub">${list.length} visible ${list.length===1?'item':'items'}</p></div></div>${list.length?`<div class="card-grid" style="padding:0 12px 14px">${list.map(p=>productCard(p,false)).join('')}</div>`:empty('shop','No items listed','This shop has no public items right now.')}</section><section class="panel" style="margin-top:14px;padding:16px">${reviewForm}<h3>Community reviews</h3>${r.count?appState.reviews.filter(x=>x.seller_id===id).map(x=>`<article class="review-line"><strong>${stars(x.rating)} ${Number(x.rating)} / 5</strong><p>${esc(x.body||'No written comment.')}</p><small>${new Date(x.created_at).toLocaleDateString('en-ZM')}</small></article>`).join(''):'<p class="panel-sub">No reviews yet.</p>'}</section>`)}
function businessPanel(){const p=appState.profile;return `<section id="business-profile-panel" class="panel business-profile-panel"><div class="panel-head"><div><h2 class="panel-title">Your business profile</h2><p class="panel-sub">Build a WhatsApp-style shop front with a name, photo, contact and hours.</p></div></div><form id="shop-profile-form" style="padding:0 18px 18px"><div class="field-grid"><div class="field"><label>SHOP NAME</label><input name="shop_name" maxlength="100" value="${esc(p.shop_name||p.full_name||'')}" required></div><div class="field"><label>SHOP CATEGORY</label><select name="shop_category">${['Shopping & retail','Food & groceries','Fashion & apparel','Home & living','Electronics','Beauty & wellness','Services','Other'].map(x=>`<option ${p.shop_category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>PUBLIC WHATSAPP NUMBER (OPTIONAL)</label><input name="shop_whatsapp" type="tel" maxlength="30" value="${esc(p.shop_whatsapp||'')}" placeholder="+260 97 000 0000"><small class="panel-sub">Separate from your private account phone number.</small></div><div class="field"><label>BUSINESS HOURS</label><input name="shop_hours" maxlength="160" value="${esc(p.shop_hours||'Open 24 hours')}" placeholder="Mon-Sat, 08:00-18:00"></div></div><div class="field"><label>ABOUT THE SHOP</label><textarea name="shop_description" rows="3" maxlength="1000" placeholder="What do you sell, and what makes your shop special?">${esc(p.shop_description||'')}</textarea></div><label class="upload-drop">${p.shop_cover_url?'Change shop cover photo':'Add a shop cover photo'}<input name="cover" type="file" accept="image/*"></label><button class="btn" style="margin-top:12px">Save business profile</button></form></section>`}
function adminFeaturePanels(){const manager=appState.profile.role==='manager',reports=appState.reports.filter(r=>['open','reviewed'].includes(r.status));return `${manager?`<section class="panel admin-feature" id="manager-settings"><div class="panel-head"><div><h2 class="panel-title">⚙ Management settings</h2><p class="panel-sub">Change the community theme and manage access.</p></div></div><form id="theme-form" style="padding:0 18px 18px"><div class="field"><label>APP THEME</label><select name="theme"><option value="teal" ${appState.theme==='teal'?'selected':''}>Zed teal</option><option value="berry" ${appState.theme==='berry'?'selected':''}>Market berry</option><option value="ocean" ${appState.theme==='ocean'?'selected':''}>Lake blue</option></select></div><button class="btn small">Save theme</button></form><div style="padding:0 18px 18px"><h3>Invite access</h3><p class="panel-sub">Create an invite token to share with the app link. Replacing it disables the old token for new sign-ups.</p>${appState.invite?`<p><code>${esc(appState.invite)}</code> <button class="btn ghost small" data-action="share-invite">Share active invite</button></p>`:'<div class="notice warn">Open the active manager invite link to load the current token before rotating it.</div>'}<form id="invite-rotate-form"><div class="callout-row"><div class="field" style="flex:1;margin:0"><label>NEW INVITE TOKEN</label><input name="token" minlength="8" maxlength="64" required placeholder="Select Generate or enter 8-64 letters/numbers"></div><button class="btn ghost small" type="button" data-action="generate-invite">Generate</button><button class="btn small">Make active</button></div></form></div><div style="padding:0 18px 18px"><h3>Member safety</h3>${appState.adminUsers.length?appState.adminUsers.map(p=>`<div class="management-row"><div><strong>${esc(p.full_name||'Member')}</strong><small>${esc(p.email||'')} · ${esc(p.role)}${p.suspended_at?' · suspended':''}</small></div><button class="btn ${p.suspended_at?'small':'danger small'}" data-action="member-suspension" data-id="${p.id}" data-value="${p.suspended_at?'restore':'suspend'}">${p.suspended_at?'Restore':'Suspend'}</button></div>`).join(''):'<p class="panel-sub">No other approved members yet.</p>'}</div></section>`:''}<section class="panel admin-feature" id="listing-reports"><div class="panel-head"><div><h2 class="panel-title">Listing reports</h2><p class="panel-sub">Review flags from community members and pull down listings when needed.</p></div><span class="badge ${reports.length?'pending':''}">${reports.length} open / in review</span></div><div style="padding:0 18px 18px">${reports.length?reports.map(r=>{const product=appState.products.find(p=>p.id===r.product_id),reporter=appState.directory.find(p=>p.id===r.reporter_id);return `<article class="report-card"><strong>${esc(product?.name||'Listing')} · ${esc(r.reason)}</strong><p>Flagged by ${esc(reporter?.full_name||'member')} · ${new Date(r.created_at).toLocaleString('en-ZM')}</p>${r.details?`<p>${esc(r.details)}</p>`:''}${r.review_note?`<p>Manager note: ${esc(r.review_note)}</p>`:''}<div class="mobile-feature-actions"><button class="btn ghost small" data-action="report-decision" data-id="${r.id}" data-value="review">Mark reviewed</button><button class="btn ghost small" data-action="report-decision" data-id="${r.id}" data-value="dismiss">Dismiss</button><button class="btn danger small" data-action="report-decision" data-id="${r.id}" data-value="hide_listing">Pull listing down</button></div></article>`}).join(''):'<div class="panel-sub">No listing reports need attention.</div>'}</div></section>`}
function enhancePage(){applyTheme();if(appState.profile?.status!=='approved'||appState.profile?.suspended_at)return;const top=document.querySelector('.topbar .top-right');if(appState.profile.role==='manager'&&top&&!top.querySelector('.manager-gear'))top.insertAdjacentHTML('afterbegin','<button class="manager-gear" data-action="management-gear" aria-label="Management settings" title="Management settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.3v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2H15v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v2.6h-.2a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>');if(appState.tab==='you'){const layout=document.querySelector('#view .profile-layout');if(layout&&!document.getElementById('business-profile-panel'))layout.insertAdjacentHTML('beforeend',businessPanel());const own=appState.products.filter(p=>p.user_id===appState.session.user.id);const inventory=document.querySelector('#view .panel-title');if(inventory?.textContent==='Your profile'){const count=[...document.querySelectorAll('#view .panel-title')].find(x=>x.textContent==='Your inventory')?.parentElement?.querySelector('.panel-sub');if(count)count.textContent=`${own.length} listings · Mark items sold or pull them down at any time.`}}if(appState.tab==='admin'&&!document.getElementById('listing-reports'))document.querySelector('#view')?.insertAdjacentHTML('beforeend',adminFeaturePanels())}
enhancePage=function(){applyTheme();if(appState.profile?.status!=='approved'||appState.profile?.suspended_at)return;const top=document.querySelector('.topbar .top-right');if(appState.profile.role==='manager'&&top&&!top.querySelector('.manager-gear'))top.insertAdjacentHTML('afterbegin','<button class="manager-gear" data-action="management-gear" aria-label="Management settings" title="Management settings">&#9881;</button>');if(appState.tab==='you'){const layout=document.querySelector('#view .profile-layout');if(layout&&!document.getElementById('business-profile-panel'))layout.insertAdjacentHTML('beforeend',businessPanel());const own=appState.products.filter(p=>p.user_id===appState.session.user.id),count=[...document.querySelectorAll('#view .panel-title')].find(x=>x.textContent==='Your inventory')?.parentElement?.querySelector('.panel-sub');if(count){const label=`${own.length} listings · Mark items sold or pull them down at any time.`;if(count.textContent!==label)count.textContent=label}const inviteButton=document.querySelector('#view [data-action="share-invite"]');if(inviteButton&&inviteButton.textContent!=='Share invite link')inviteButton.textContent='Share invite link'}if(appState.tab==='admin'&&!document.getElementById('listing-reports'))document.querySelector('#view')?.insertAdjacentHTML('beforeend',adminFeaturePanels())};
render=function(){if(appState.profile?.suspended_at){document.documentElement.dataset.theme=appState.theme||'teal';app.innerHTML=`${topbar(true)}<main class="setup-wrap"><section class="panel setup-content"><h1>Account paused</h1><p>Your access to the marketplace is temporarily suspended. Contact the manager if you think this is a mistake.</p><button class="btn danger" data-action="sign-out">Log out</button></section></main>`;return}applyTheme();const token=appState.invite,valid=appState.inviteValid;if(appState.session){appState.invite=appState.invite||'signed-in-member';appState.inviteValid=true}try{originalRender()}finally{appState.invite=token;appState.inviteValid=valid}setTimeout(enhancePage,0)};
refreshData=async function(){await originalRefreshData();if(!appState.session||appState.profile?.status!=='approved'||appState.profile?.suspended_at)return;const db=appState.client,staff=['manager','moderator'].includes(appState.profile.role),jobs=await Promise.all([db.from('seller_directory').select('id,full_name,city,province,avatar_url,shop_cover_url,encryption_public_key,shop_name,shop_description,shop_category,shop_whatsapp,shop_hours').order('full_name'),db.from('products').select('*').order('created_at',{ascending:false}),db.from('seller_reviews').select('*').order('created_at',{ascending:false}),db.from('marketplace_settings').select('theme,active_invite_token').eq('id',true).maybeSingle(),staff?db.from('listing_reports').select('*').in('status',['open','reviewed']).order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})]);for(const result of jobs)if(result.error)throw result.error;let activeInvite=jobs[3].data?.active_invite_token||'';if(!activeInvite&&appState.profile.role==='manager'&&appState.invite){const {error}=await db.rpc('publish_active_invite',{p_token:appState.invite});if(!error)activeInvite=appState.invite}appState.directory=jobs[0].data||[];appState.products=jobs[1].data||[];appState.reviews=jobs[2].data||[];appState.theme=jobs[3].data?.theme||'teal';if(activeInvite){appState.invite=activeInvite;appState.inviteValid=true;history.replaceState({},'',`?invite=${encodeURIComponent(activeInvite)}`)}appState.reports=jobs[4].data||[];applyTheme();render();if(appState.pendingShopId&&appState.directory.some(s=>s.id===appState.pendingShopId)){const id=appState.pendingShopId;appState.pendingShopId='';shopDetail(id)}};
loadAdminUsers=async function(){if(appState.profile?.role!=='manager')return;const {data,error}=await appState.client.from('profiles').select('id,email,full_name,status,role,suspended_at,suspension_note').eq('status','approved').neq('id',appState.session.user.id).order('full_name');if(error)throw error;appState.adminUsers=data||[];if(appState.tab==='admin')render()};
function inviteUrl(){return appState.invite?`${location.origin}/join/${encodeURIComponent(appState.invite)}`:''}
async function saveShopProfile(form){const fd=new FormData(form);if(String(fd.get('shop_name')).trim().length<2)throw new Error('Enter a shop name.');let cover=appState.profile.shop_cover_url||null;if(fd.get('cover')?.size)cover=await uploadAsset(fd.get('cover'),'cover');const values={shop_name:String(fd.get('shop_name')).trim(),shop_description:String(fd.get('shop_description')).trim(),shop_category:String(fd.get('shop_category')),shop_whatsapp:String(fd.get('shop_whatsapp')).trim(),shop_hours:String(fd.get('shop_hours')).trim()||'Contact for hours',shop_cover_url:cover};const {error}=await appState.client.from('profiles').update(values).eq('id',appState.session.user.id);if(error)throw error;appState.profile={...appState.profile,...values};await refreshData();showToast('Business profile saved.')}
async function saveReview(form){const sellerId=form.dataset.id,fd=new FormData(form),row={seller_id:sellerId,reviewer_id:appState.session.user.id,rating:Number(fd.get('rating')),body:String(fd.get('body')||'').trim(),updated_at:new Date().toISOString()};const {error}=await appState.client.from('seller_reviews').upsert(row,{onConflict:'seller_id,reviewer_id'});if(error)throw error;await refreshData();shopDetail(sellerId);showToast('Review saved.')}
async function submitListingReport(form){const fd=new FormData(form),row={product_id:form.dataset.id,reporter_id:appState.session.user.id,reason:String(fd.get('reason')),details:String(fd.get('details')||'').trim()};const {error}=await appState.client.from('listing_reports').insert(row);if(error)throw error;overlay.innerHTML='';await refreshData();showToast('Listing flag sent to management.')}
async function share(url,title,text){if(!url){showToast('The active invite is not available on this page.');return}try{const {data}=await appState.client.from('marketplace_settings').select('active_invite_token').eq('id',true).maybeSingle();if(data?.active_invite_token){const shop=new URL(url).searchParams.get('shop');appState.invite=data.active_invite_token;appState.inviteValid=true;history.replaceState({},'',`?invite=${encodeURIComponent(appState.invite)}`);url=`${location.origin}/join/${encodeURIComponent(appState.invite)}${shop?`?shop=${encodeURIComponent(shop)}`:''}`}if(navigator.share)await navigator.share({title,text,url});else{await navigator.clipboard.writeText(url);showToast('Link copied.')}}catch(error){if(error.name!=='AbortError')prompt('Copy this link',url)}}
const customActions=new Set(['management-gear','generate-invite','listing-status','listing-visibility','report-listing','report-decision','member-suspension','shop-share']);
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||!customActions.has(el.dataset.action))return;event.preventDefault();event.stopImmediatePropagation();try{const id=el.dataset.id,value=el.dataset.value;switch(el.dataset.action){case'management-gear':appState.tab='admin';await loadAdminUsers();document.getElementById('manager-settings')?.scrollIntoView({behavior:'smooth'});break;case'generate-invite':{const input=document.querySelector('#invite-rotate-form [name="token"]');if(input)input.value=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(16).padStart(2,'0')).join('');break}case'listing-status':{const {error}=await appState.client.from('products').update({listing_status:value,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await refreshData();showToast(value==='sold'?'Listing marked sold.':'Listing marked available.');break}case'listing-visibility':{if(!confirm(value==='hide'?'Pull this listing down from your public shop?':'Put this listing back up?'))break;const {error}=await appState.client.from('products').update({is_active:value==='show',updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await refreshData();showToast(value==='hide'?'Listing pulled down.':'Listing is back in your shop.');break}case'report-listing':{const p=appState.products.find(x=>x.id===id);showModal('Flag this listing',`<p class="panel-sub">Tell management what needs review: <strong>${esc(p?.name||'listing')}</strong></p><form id="listing-report-form" data-id="${id}"><div class="field"><label>REASON</label><select name="reason" required><option>Misleading or incorrect</option><option>Prohibited or unsafe item</option><option>Suspected scam</option><option>Duplicate listing</option><option>Other concern</option></select></div><div class="field"><label>DETAILS (OPTIONAL)</label><textarea name="details" maxlength="1000" rows="3" placeholder="Add context for the manager"></textarea></div><button class="btn danger">Send flag for review</button></form>`);break}case'report-decision':{const note=prompt(value==='hide_listing'?'Why should this listing be pulled down?':'Add an optional management note.','');if(note===null)break;const {error}=await appState.client.rpc('moderate_listing_report',{p_report_id:id,p_action:value,p_note:note});if(error)throw error;await refreshData();showToast(value==='hide_listing'?'Listing pulled down.':value==='dismiss'?'Report dismissed.':'Report marked reviewed.');break}case'member-suspension':{const suspend=value==='suspend',note=suspend?prompt('Reason for temporarily pausing this member account:','Community guidelines review'):'';if(suspend&&note===null)break;const {error}=await appState.client.rpc('set_member_suspension',{p_user_id:id,p_suspend:suspend,p_note:note});if(error)throw error;await loadAdminUsers();showToast(suspend?'Member access suspended.':'Member access restored.');break}case'shop-share':{const url=inviteUrl();if(!url)throw new Error('Open the shop from an invited member link to share it.');await share(`${url}?shop=${encodeURIComponent(id)}`,`Visit ${appState.directory.find(s=>s.id===id)?.shop_name||'this shop'}`,'Browse this local shop and its catalogue.');break}}}catch(error){showToast(error.message||'Could not complete that action.')}},true);
document.addEventListener('submit',async event=>{const form=event.target;if(!['shop-profile-form','review-form','listing-report-form','theme-form'].includes(form.id))return;event.preventDefault();event.stopImmediatePropagation();try{if(form.id==='shop-profile-form')await saveShopProfile(form);else if(form.id==='review-form')await saveReview(form);else if(form.id==='listing-report-form')await submitListingReport(form);else{const theme=String(new FormData(form).get('theme'));const {error}=await appState.client.rpc('set_marketplace_theme',{p_theme:theme});if(error)throw error;appState.theme=theme;applyTheme();await refreshData();showToast('Community theme updated.')}}catch(error){form.insertAdjacentHTML('beforeend',`<div class="notice error" style="margin-top:10px">${esc(error.message||'Could not save changes.')}</div>`)}},true);
new MutationObserver(enhancePage).observe(app,{childList:true,subtree:true});
boot().catch(error=>{app.innerHTML=`${topbar()}<main class="setup-wrap"><div class="notice error">${esc(error.message||'Unable to start the app.')}</div></main>`});
})();
</script>
